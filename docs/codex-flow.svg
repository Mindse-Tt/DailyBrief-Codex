<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" role="img" aria-label="DailyBrief-Codex workflow">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #172033; }
      .sub { font-size: 15px; fill: #64748b; }
      .label { font-size: 17px; font-weight: 720; fill: #172033; }
      .small { font-size: 13px; fill: #64748b; }
      .code { font-size: 13px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .card { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1.4; }
      .soft { fill: #f8fafc; stroke: #d8e0ea; stroke-width: 1.2; }
      .arrow { stroke: #718096; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/>
    </marker>
  </defs>

  <rect width="1160" height="520" fill="#f6f8fb"/>

  <text x="60" y="58" class="title">DailyBrief-Codex</text>
  <text x="60" y="86" class="sub">A local daily intelligence loop: Codex runs it, local CLI summarizes it, Markdown and HTML archive it.</text>

  <g transform="translate(60 128)">
    <rect class="card" x="0" y="0" width="190" height="116" rx="14"/>
    <rect x="0" y="0" width="190" height="7" rx="3.5" fill="#2563eb"/>
    <text x="22" y="42" class="label">Codex Trigger</text>
    <text x="22" y="69" class="small">manual request</text>
    <text x="22" y="91" class="small">or daily automation</text>
  </g>

  <path class="arrow" d="M260 186 H322"/>

  <g transform="translate(330 128)">
    <rect class="card" x="0" y="0" width="190" height="116" rx="14"/>
    <rect x="0" y="0" width="190" height="7" rx="3.5" fill="#16a34a"/>
    <text x="22" y="42" class="label">Local Runner</text>
    <text x="22" y="69" class="code">npm run codex:daily</text>
    <text x="22" y="91" class="small">Shanghai time, zh report</text>
  </g>

  <path class="arrow" d="M530 186 H592"/>

  <g transform="translate(600 128)">
    <rect class="card" x="0" y="0" width="190" height="116" rx="14"/>
    <rect x="0" y="0" width="190" height="7" rx="3.5" fill="#f59e0b"/>
    <text x="22" y="42" class="label">Public Sources</text>
    <text x="22" y="69" class="small">RSS / JSON / trends</text>
    <text x="22" y="91" class="small">no news API key</text>
  </g>

  <path class="arrow" d="M800 186 H862"/>

  <g transform="translate(870 128)">
    <rect class="card" x="0" y="0" width="230" height="116" rx="14"/>
    <rect x="0" y="0" width="230" height="7" rx="3.5" fill="#7c3aed"/>
    <text x="22" y="42" class="label">Local CLI Backend</text>
    <text x="22" y="69" class="small">summaries, ranking, market notes</text>
    <text x="22" y="91" class="small">no extra LLM API key by default</text>
  </g>

  <path class="arrow" d="M985 252 V305"/>

  <g transform="translate(770 315)">
    <rect class="card" x="0" y="0" width="330" height="112" rx="14"/>
    <rect x="0" y="0" width="330" height="7" rx="3.5" fill="#0f766e"/>
    <text x="24" y="42" class="label">Report Artifacts</text>
    <text x="24" y="69" class="code">HTML + Markdown + JSON</text>
    <text x="24" y="91" class="small">readable, archivable, agent-friendly</text>
  </g>

  <path class="arrow" d="M760 371 H692"/>

  <g transform="translate(410 315)">
    <rect class="card" x="0" y="0" width="270" height="112" rx="14"/>
    <rect x="0" y="0" width="270" height="7" rx="3.5" fill="#dc2626"/>
    <text x="24" y="42" class="label">Codex Summary</text>
    <text x="24" y="69" class="small">overview, tech, finance, politics</text>
    <text x="24" y="91" class="small">plus local file paths</text>
  </g>

  <path class="arrow" d="M400 371 H332"/>

  <g transform="translate(60 315)">
    <rect class="soft" x="0" y="0" width="260" height="112" rx="14"/>
    <text x="24" y="42" class="label">Daily Habit</text>
    <text x="24" y="69" class="small">wake up, read one brief</text>
    <text x="24" y="91" class="small">reuse in posts, notes, research</text>
  </g>

  <text x="60" y="476" class="sub">Built as a Codex-first local fork of DailyBrief by Mindse-Tt. Upstream remains credited under MIT.</text>
</svg>
